<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #1e1e1e;
            color: #cccccc;
            margin: 0;
            padding: 40px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2em;
            color: #888888;
            margin-bottom: 40px;
        }
        a.button {
            font-size: 1.1em;
            color: #ffffff;
            background-color: #007acc;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin: 0 10px;
        }
        a.button:hover {
            background-color: #005a9e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Forge</h1>
        <p>Your AI Collaborative Partner</p>
        <div>

            <a href="action:open_folder" class="button">Open Folder...</a>
            <a href="action:clone_repo" class="button">Clone Repository...</a>
        </div>
    </div>
</body>
</html>
